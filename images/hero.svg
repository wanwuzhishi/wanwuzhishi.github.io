<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080c1a"/>
      <stop offset=".52" stop-color="#101733"/>
      <stop offset="1" stop-color="#0a0f22"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx=".2" cy=".16" r=".66">
      <stop offset="0" stop-color="#5b8cff" stop-opacity=".58"/>
      <stop offset="1" stop-color="#5b8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx=".82" cy=".1" r=".6">
      <stop offset="0" stop-color="#8f6bff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#8f6bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx=".56" cy="1" r=".66">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".26"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2=".6" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".11"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="44" height="44" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.3" fill="#ffffff" fill-opacity=".07"/>
    </pattern>
    <pattern id="grid" width="132" height="132" patternUnits="userSpaceOnUse">
      <path d="M132 0H0V132" fill="none" stroke="#ffffff" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
    <radialGradient id="vignette" cx=".5" cy=".46" r=".8">
      <stop offset=".5" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".6"/>
    </radialGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b8cff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#7ea6ff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#8f6bff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#base)"/>
  <rect width="1920" height="1080" fill="url(#glowBlue)"/>
  <rect width="1920" height="1080" fill="url(#glowViolet)"/>
  <rect width="1920" height="1080" fill="url(#glowCyan)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <rect width="1920" height="1080" fill="url(#dots)"/>

  <!-- 斜向光带 -->
  <g fill="url(#beam)">
    <polygon points="120,-260 470,-260 120,1340 -230,1340" opacity=".55"/>
    <polygon points="960,-260 1230,-260 660,1340 390,1340" opacity=".38"/>
    <polygon points="1640,-260 1870,-260 1420,1340 1190,1340" opacity=".3"/>
  </g>

  <!-- 星点 -->
  <g fill="#ffffff">
    <circle cx="184" cy="142" r="2.2" opacity=".85"/>
    <circle cx="352" cy="86" r="1.5" opacity=".6"/>
    <circle cx="520" cy="214" r="1.8" opacity=".7"/>
    <circle cx="690" cy="120" r="1.2" opacity=".5"/>
    <circle cx="840" cy="252" r="2" opacity=".7"/>
    <circle cx="1010" cy="96" r="1.4" opacity=".55"/>
    <circle cx="1168" cy="206" r="2.4" opacity=".8"/>
    <circle cx="1332" cy="132" r="1.3" opacity=".5"/>
    <circle cx="1490" cy="240" r="1.9" opacity=".7"/>
    <circle cx="1660" cy="104" r="1.5" opacity=".6"/>
    <circle cx="1806" cy="196" r="2.1" opacity=".75"/>
    <circle cx="268" cy="452" r="1.6" opacity=".55"/>
    <circle cx="596" cy="520" r="1.2" opacity=".45"/>
    <circle cx="1180" cy="470" r="1.7" opacity=".55"/>
    <circle cx="1560" cy="508" r="1.3" opacity=".45"/>
    <circle cx="1760" cy="420" r="1.6" opacity=".5"/>
    <circle cx="140" cy="640" r="1.4" opacity=".4"/>
    <circle cx="420" cy="742" r="1.2" opacity=".35"/>
    <circle cx="980" cy="700" r="1.5" opacity=".4"/>
    <circle cx="1420" cy="768" r="1.2" opacity=".35"/>
    <circle cx="1860" cy="690" r="1.4" opacity=".4"/>
  </g>

  <!-- 地平线光弧 -->
  <ellipse cx="960" cy="1130" rx="1180" ry="300" fill="none" stroke="url(#horizon)" stroke-width="2.5" opacity=".9"/>
  <ellipse cx="960" cy="1190" rx="1420" ry="360" fill="none" stroke="url(#horizon)" stroke-width="1.5" opacity=".45"/>

  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
